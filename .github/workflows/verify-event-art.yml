name: Verify event and situation art
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tools/verify_event_art.py
      - run: python tools/gathering.py
      - run: git diff --exit-code -- mod/in_game/events/goblins_gathering.txt
