l_english:
 religious_influence_cm_hunger_below: "Covenant Favor"
 ac_common_hearth: "Feed the Common Hearth"
 ac_common_hearth_desc: "The first share sustains the households. Chiefs must answer for empty stores."
 ac_offering_smoke: "Smoke Is an Offering"
 ac_offering_smoke_desc: "Useful work feeds the fire below. Forge crews dedicate their first finished piece."
 ac_crew_home: "Bring the Crew Home"
 ac_crew_home_desc: "The Lantern Dead guide those who keep the rescue lights burning. Reckon the cargo after the living."
 ac_remembered_dead: "The Dead Keep Their Names"
 ac_remembered_dead_desc: "Funeral keepers recite the names and obligations carried by each household."
 ac_cutting_oath: "No Axe Without an Oath"
 ac_cutting_oath_desc: "Root-wardens guard seed groves, firebreaks and the wooded paths that shelter our people."
 ac_shore_spirits: "Every Shore Has Spirits"
 ac_shore_spirits_desc: "An unfamiliar shore has powers of its own. Its inhabitants may teach us how to honor them."
 ac_first_share: "The First Share Goes Below"
 ac_first_share_desc: "The Hunger receives the first offering after battle; the bereaved must also receive their due."
 ac_many_hearths: "Many Hearths, One Covenant"
 ac_many_hearths_desc: "Each shrine keeps its own witnesses. A common faith need not silence its many voices."
 ac_first_mouth: "The First Mouth"
 ac_first_mouth_desc: "A warm fissure beneath Cinder Crown. Ember-speakers listen through hollow stone tubes while forge crews surrender their first work. No one agrees whether the first goblins were born here or escaped through it."
 ac_first_mouth_site: "The First Mouth"
 ac_listening_pool: "The Listening Pool"
 ac_listening_pool_desc: "A spring-fed pool beside the tidal channels. Carved stakes record repair oaths, and old flood marks remind the marsh houses what neglect can cost."
 ac_listening_pool_site: "The Listening Pool"
 ac_lantern_steps: "The Lantern Steps"
 ac_lantern_steps_desc: "Steps descend to the landing where the drowned are brought ashore. Lamps burn beside name stones; strangers receive a stone even when no name survives."
 ac_lantern_steps_site: "The Lantern Steps"
 ac_mothers_basin: "The Mothers' Basin"
 ac_mothers_basin_desc: "Maternal households wash heirloom cords in a rain-fed basin above the harbor. Each knot recalls a dependent, a promise or a return from sea."
 ac_mothers_basin_site: "The Mothers' Basin"
 ac_storm_teeth: "The Storm Teeth"
 ac_storm_teeth_desc: "Basalt pinnacles carry ropes left by returning crews. Pilgrims climb with a stone for someone who never returned, seeking the courage of the Tooth in the Gale."
 ac_storm_teeth_site: "The Storm Teeth"
 ac_emberroot: "The Emberroot Hollow"
 ac_emberroot_desc: "A charred stump marks the first sheltered hearth. Funeral ash is laid beneath young trees, and Root-wardens keep the surrounding seed grove from the charcoal axes."
 ac_emberroot_site: "The Emberroot Hollow"
 ac_returning_ash: "Feast of Returning Ash"
 ac_returning_ash_desc: "Fund a communal feast and name the dead. Costs two months of scaled income and 20 Covenant Favor. The blessing lasts five years; all major rites share a five-year cooldown."
 ac_water_lanterns: "Lanterns Upon the Water"
 ac_water_lanterns_desc: "Provision beacon keepers and the households of missing crews. Costs two months of scaled income and 20 Covenant Favor. The blessing lasts five years; all major rites share a five-year cooldown."
 ac_first_oath: "Renewal of the First Oath"
 ac_first_oath_desc: "Reconcile the crown with the Oathkeepers and renew communal duties. Costs two months of scaled income and 20 Covenant Favor. The blessing lasts five years; all major rites share a five-year cooldown."
 ac_local_covenants: "The Local Covenants"
 ac_local_covenants_desc: "The settlement agreed at the Moot of Six Fires."
 ac_first_oathkeeper: "The First Oathkeeper"
 ac_first_oathkeeper_desc: "The settlement agreed at the Moot of Six Fires."
 ashen_covenant.1.title: "The Mountain Answers"
 ashen_covenant.1.desc: "A tremor opens a narrow cavity beneath the First Mouth. Miners want to follow the warm draft; the Ember-speakers demand that the listening fissure be made safe first."
 ashen_covenant.1.a: "Secure the fissure and hear the witnesses."
 ashen_covenant.1.b: "Let the miners follow the draft."
 ashen_covenant.2.title: "The Flood Remembers"
 ashen_covenant.2.desc: "The stakes at the Listening Pool name a wealthy house that promised labor after the last flood. Its heirs now deny the debt. The Reed-witnesses bring the old flood marks before the crown."
 ashen_covenant.2.a: "Fund the repairs and uphold the oath."
 ashen_covenant.2.b: "Accept the heirs' objection."
 ashen_covenant.3.title: "A Stranger Beneath Our Lantern"
 ashen_covenant.3.desc: "A foreign sailor has washed ashore at the Lantern Steps. Some households refuse a stranger a place among their dead; the keepers answer that the sea did not ask his birthplace."
 ashen_covenant.3.a: "Give the stranger a lamp and a stone."
 ashen_covenant.3.b: "Leave the burial to the harbor households."
 ashen_covenant.4.title: "A Cord Without a Name"
 ashen_covenant.4.desc: "A dependent branch of the maternal house presents an unmarked cord at the Mothers' Basin. Recognizing it would make old promises public and give its households a voice at future observances."
 ashen_covenant.4.a: "Provide the gifts and witness their names."
 ashen_covenant.4.b: "Let the senior households settle it."
 ashen_covenant.5.title: "The Path to the Storm Teeth"
 ashen_covenant.5.desc: "Loose stone has made the pilgrimage climb dangerous. Returning captains demand a repaired path, while younger crews call the danger a fitting test of the storm spirit."
 ashen_covenant.5.a: "Repair the path before another climb."
 ashen_covenant.5.b: "Leave the climb to those who dare."
 ashen_covenant.6.title: "The Forbidden Felling"
 ashen_covenant.6.desc: "Charcoal burners have marked trees inside Emberroot Hollow. The navy needs timber and the forges need fuel, but Root-wardens insist that a seed grove cannot be bought back once it is gone."
 ashen_covenant.6.a: "Pay for supplies from outside the grove."
 ashen_covenant.6.b: "Permit a limited cutting."
 ashen_covenant.7.title: "The Unnamed Crew"
 ashen_covenant.7.desc: "A captain has omitted missing sailors from his account of a voyage. Naming them would oblige his patrons to support their households. The Lantern-keepers have brought their families to court."
 ashen_covenant.7.a: "Compensate the households and record the names."
 ashen_covenant.7.b: "Accept the captain's account."
 ashen_covenant.8.title: "The Hungry Preacher"
 ashen_covenant.8.desc: "A wandering speaker claims that charcoal and food no longer satisfy the Hunger Below. The local Oathkeepers accuse the preacher of making the mountain an excuse for ambition."
 ashen_covenant.8.a: "Sponsor a public feast under the Oathkeepers."
 ashen_covenant.8.b: "Let the shrines answer without the crown."
 ashen_covenant.9.title: "The Captive's Hearth"
 ashen_covenant.9.desc: "An enslaved household asks to name its dead beside those of its owners. Its speaker asks whether sharing a hearth creates duties even toward captives. Several chiefs fear the precedent."
 ashen_covenant.9.a: "Pay for their memorial and acknowledge the duty."
 ashen_covenant.9.b: "Leave the matter to the household's owners."
 ashen_covenant.10.title: "A Spirit Beyond the Sea"
 ashen_covenant.10.desc: "Our overseas crews return with accounts of a sacred place tended by people beyond the Isles. Some wish to offer useful gifts there; others fear acknowledging powers whose names we barely know."
 ashen_covenant.10.a: "Send gifts and learn the local observances."
 ashen_covenant.10.b: "Keep our offerings for the island shrines."
 ashen_covenant.11.title: "The Empty Feast"
 ashen_covenant.11.desc: "Common-hearth keepers report that some households cannot bring even a small offering to the seasonal feast. A chief's full table has become an accusation against him."
 ashen_covenant.11.a: "Feed the households from the crown's stores."
 ashen_covenant.11.b: "Require each household to provide its share."
 ashen_covenant.12.title: "The First Finished Blade"
 ashen_covenant.12.desc: "Forge crews disagree over an unusually fine blade set aside for the First Mouth. A captain wants it for the muster; the smith who made it insists that an offering is an oath already spoken."
 ashen_covenant.12.a: "Pay the smith and honor the offering."
 ashen_covenant.12.b: "Send the blade to the muster."
 ashen_covenant.20.title: "The Moot of Six Fires"
 ashen_covenant.20.desc: "The islands answer to a common realm, but their Oathkeepers speak with many voices. Ember-speakers ask who will witness the crown's promises. Tide-mothers insist that no common authority erase their household cords. The gathered custodians await a settlement: renew the local covenants, or appoint a First Oathkeeper to serve the united realm?"
 ashen_covenant.20.a: "Renew the local covenants. Each shrine keeps its witnesses."
 ashen_covenant.20.b: "Appoint a First Oathkeeper to the common realm."
