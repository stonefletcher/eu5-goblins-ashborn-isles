 cm_cinderkin_desc: "The Emberblood trace their beginnings to Cindermaw's volcanic crown. Forge fires, ironwork and the oaths of war-kings bind their crowded ports and mountain settlements."
 cm_brinekin_desc: "The Brineward belong to Brackmaw's tidal woods and salt marshes. Timber cutters, reedland farmers and patient coastal navigators keep their communities supplied."
 cm_reefkin_desc: "The Reefstriders know the narrow passages and hidden shoals around Reefhook. Fishing, diving and trade between sheltered anchorages shape their island life."
 cm_shatterkin_desc: "The Stormfang inhabit the broken shores of Shatterfin and Knifeback. Crews raised on rough channels prize seamanship, daring and fierce loyalty to their own harbors."
 cm_sootkin_desc: "The Ashveil live beneath Sootwake's dark ridges. Woodland crafts, charcoal fires and quiet upland settlements give their island a character distinct from the busier clan ports."
 cm_goblin_group_desc: "The peoples who emerged with the Ashborn Isles in the early fourteenth century."
 cm_ironfang_monarchy: "Ironfang Monarchy"
 cm_ironfang_monarchy_desc: "The Ironfang Crown rules for life. Under the Rule of the Strongest, the adult Ashborn man with the highest Military ability succeeds, regardless of dynasty or estate. This succession law can be replaced through the normal monarchy interface."
 cm_rule_of_the_strongest: "Rule of the Strongest"
 cm_rule_of_the_strongest_desc: "On succession, the eligible adult Ashborn man in this country with the highest Military ability takes the crown. Administrative ability and then age break ties. Foreign rulers, children and characters barred from ruling are excluded. There are no fixed terms or periodic challenges."
 cm_succession_military_score: "Military ability (strength)"
 cm_succession_admin_tiebreak: "Administrative ability (tie-break)"
 cm_succession_age_tiebreak: "Age (final tie-break)"
