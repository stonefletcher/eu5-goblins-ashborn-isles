 goblins_exploration.1.east_terms: "Pay 5 gold once. Chart Lisbon, Porto, Setubal and the nearby sea, without revealing inland territory. Travel takes 4 months. When the crew arrives, the current owners of these ports learn the Ashborn homeland and its surrounding waters. Crews then rest for 12 months."
 goblins_exploration.1.wait_terms: "No payment. The next automatic offer is six months away. This also restores reminders if they were stopped."
 goblins_exploration.1.pause: "Stop reminders; I will commission a voyage myself."
 goblins_exploration.1.pause_terms: "No payment. Review Ashborn Voyages on either Ashborn situation panel to reopen an available route. Reminders stay off after manual voyages."
 goblins_exploration.3.north_terms: "Pay 10 gold once. Chart Brest, La Rochelle, Bordeaux, Plymouth, Southampton and the nearby sea, without revealing inland territory. Travel takes 6 months. When the crew arrives, the current owners of these ports learn the Ashborn homeland and its surrounding waters. Crews then rest for 12 months."
 goblins_exploration.3.south_terms: "Pay 10 gold once. Chart Cadiz, Tangier, Ceuta, Strait Of Gibraltar and the nearby sea, without revealing inland territory. Travel takes 6 months. When the crew arrives, the current owners of these ports learn the Ashborn homeland and its surrounding waters. Crews then rest for 12 months."
 goblins_exploration.3.wait_terms: "No payment. The next automatic offer is six months away. This also restores reminders if they were stopped."
 goblins_exploration.3.pause: "Stop reminders; I will commission a voyage myself."
 goblins_exploration.3.pause_terms: "No payment. Review Ashborn Voyages on either Ashborn situation panel to reopen an available route. Reminders stay off after manual voyages."
