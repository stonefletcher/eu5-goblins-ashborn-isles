 ga_commission_voyage_desc: "[SCOPE.sCountry('actor').Custom('ga_exp_status')]\n\nOpen the available routes without paying. Payment happens only when you commission a voyage. Reminders remain stopped unless you choose to be reminded in six months. The first offer requires 36 months of preparation; crews rest for 12 months after returning."
