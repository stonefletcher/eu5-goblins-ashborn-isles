l_english:
 ga_offer_harbor_pact: "Offer a Harbor Pact"
 ga_offer_harbor_pact_desc: "Offer a normal alliance to another independent Ashborn kingdom. Its ruler may accept or refuse; membership does not satisfy unification."
 ga_send_supplies: "Send Grain and Iron"
 ga_send_supplies_desc: "Pay 10 gold to send supplies to another independent Ashborn kingdom. The recipient gains 10 gold and improved opinion of you for five years."
 ga_offer_compact: "Negotiate the Ashen Compact"
 ga_offer_compact_desc: "Offer voluntary vassalage to an allied kingdom with at least 125 opinion, at most 65% of your strength, and no higher country rank. The recipient must consent. Its dynasty and succession laws remain in place."
 ga_challenge_crown: "Challenge a Rival Crown"
 ga_challenge_crown_desc: "Gain a five-year native subjugation casus belli against an independent goblin rival. You must declare and win a normal war; this action grants no subjects."
 ga_claim_homeland: "Claim a Rival Harbor"
 ga_claim_homeland_desc: "Gain a five-year native province conquest casus belli for a rival goblin capital province. Normal declarations, peace costs and territorial transfers apply."
 ga_prepare_crossing: "Prepare the Eastern Crossing"
 ga_prepare_crossing_desc: "Pay 20 gold for five years of 15% lower transport construction cost and 5% higher naval morale. Ships, armies and land must still be obtained through normal gameplay. Available once every ten years."
 ga_plan_eastern_foothold: "Plan an Eastern Foothold"
 ga_plan_eastern_foothold_desc: "Pay 10 gold and select a discovered European coastal province. Gain a five-year conquest casus belli against its current owner. Selecting another province replaces the permitted eastern objective. No war is declared and no land is granted."
 ga_harbor_pact_opinion: "The Harbor Pact"
 ga_received_supplies: "Grain and Iron Received"
 ga_oath_honored: "The Ashen Oath"
 ga_gathering_claimant: "Claimant Among the Five"
 ga_gathering_claimant_desc: "Claimant Among the Five. A temporary benefit from the Ashborn situation."
 ga_gathering_defiant: "Our Shores, Our Crown"
 ga_gathering_defiant_desc: "Our Shores, Our Crown. A temporary benefit from the Ashborn situation."
 ga_compact_guarantees: "Guarantees of the Ashen Compact"
 ga_compact_guarantees_desc: "Guarantees of the Ashen Compact. A temporary benefit from the Ashborn situation."
 ga_unification_recovery: "Five Crowns, One Hunger"
 ga_unification_recovery_desc: "Five Crowns, One Hunger. A temporary benefit from the Ashborn situation."
 ga_crossing_preparations: "The Eastern Crossing"
 ga_crossing_preparations_desc: "The Eastern Crossing. A temporary benefit from the Ashborn situation."
 ga_first_eastern_harbor: "The First Eastern Harbor"
 ga_first_eastern_harbor_desc: "The First Eastern Harbor. A temporary benefit from the Ashborn situation."
 ga_cb_eastern_foothold: "Eastern Foothold"
 ga_cb_eastern_foothold_desc: "Secure the selected coastal province through a normal conquest war. No territory is awarded by the event chain."
 ga_gathering.1.a: "Our crown shall lead them."
 ga_gathering.1.b: "Find those worth standing beside."
 ga_gathering.1.c: "Our shores answer to us alone."
 ga_gathering.1.title: "A Seat Among the Five"
 ga_gathering.1.desc: "The mountains have shaken and the five crowns send their captains to the gathering. The Hunger Below binds us, but no crown commands all our shores. Shall we claim leadership, seek partners, or guard our independence? Use the Gathering of the Five situation to negotiate pacts, send aid, offer voluntary vassalage or obtain war justifications. Every homeland location must fall under one authority before the eastward ambition begins."
 ga_gathering.2.a: "Let our ships stand together."
 ga_gathering.2.b: "Our harbor needs no such pact."
 ga_gathering.2.title: "A Harbor Pact Offered"
 ga_gathering.2.desc: "[ROOT.GetCountry.MakeScope.GetVariable('ga_offer_sender').GetCountry.GetName] offers a pact between our harbors. Acceptance creates an ordinary alliance, with its usual obligations. We retain our crown and independence; a pact is not submission."
 ga_gathering.3.a: "Keep our house and customs; we shall swear."
 ga_gathering.3.b: "Friendship does not purchase our crown."
 ga_gathering.3.title: "The Price of an Oath"
 ga_gathering.3.desc: "[ROOT.GetCountry.MakeScope.GetVariable('ga_offer_sender').GetCountry.GetName] asks us to join the Ashen Compact as a vassal. Our ruling house and succession customs remain, including the Tidemother law where it is in force. Normal vassal tribute and obligations apply. A ten-year loyalty benefit represents guarantees made at the gathering. We may refuse."
 ga_gathering.4.a: "Honor the oath."
 ga_gathering.4.title: "An Oath Accepted"
 ga_gathering.4.desc: "Another Ashborn crown has accepted our protection under the Compact. Its dynasty and customs endure beneath our authority. Remaining independent kingdoms may still resist; the gathering ends only when every homeland location is held by us, our vassals, or our junior union partners."
 ga_gathering.5.a: "Let the captains look east."
 ga_gathering.5.title: "Five Crowns, One Hunger"
 ga_gathering.5.desc: "Every shore of the Ashborn homeland now answers to one authority. Some crowns may have fallen; others endure through oaths or a union. Our dynasty keeps its name. Beyond the smoke, the eastern coasts await. Unification grants no foreign territory."
 ga_gathering.6.a: "Charts, provisions, then a harbor."
 ga_gathering.6.title: "Beyond the Ashen Horizon"
 ga_gathering.6.desc: "The homeland is united, but Europe must be approached by sea. Complete the existing exploration voyages to chart its coast. The Eastern Hunger situation offers paid fleet preparation and a temporary casus belli for a chosen coastal province. Build your ships, choose your enemy and win your war; neither land nor troops are provided."
 ga_gathering.7.a: "Our house endures."
 ga_gathering.7.title: "One Hunger Beyond the Isles"
 ga_gathering.7.desc: "The island struggle is settled under a common authority. Our crown still stands and our succession customs remain. Our people may now share in an eastern expedition through the normal obligations of our vassalage or union."
 ga_gathering.8.a: "The eastern horizon is open."
 ga_gathering.8.title: "The First Eastern Harbor"
 ga_gathering.8.desc: "Our realm has secured a European coastal foothold while the homeland remains united. It was acquired through the ordinary rules of diplomacy and war. The situation rewards the achievement with prestige and a temporary naval recovery benefit. No further territory is bestowed."
 ga_gathering.10.a: "Let the forges serve our claim."
 ga_gathering.10.title: "The Forges Must Be Fed"
 ga_gathering.10.desc: "Our forge captains see strength in a united archipelago. We can seek recognition through war, or supply those willing to stand beside us."
 ga_gathering.11.a: "Let every crown reckon what it owes Brackhaven."
 ga_gathering.11.title: "The Sluice-King's Bargain"
 ga_gathering.11.desc: "Murgash earned the name Sluice-King when he sacrificed his own hall's embankment to save Brackhaven's granaries. Now the marsh houses bring their notched tide-staves to court: timber owed, fish salted, gates repaired. He would bind the other crowns as he bound the reedlands, through supplies they cannot afford to lose. Cindermaw needs our timber; the smaller harbors need our stores. Paid aid and carefully chosen alliances can carry Brackmaw's influence beyond the marshes, but each gift drains the treasury and each promise must be honored."
 ga_gathering.12.a: "Our harbor has a voice."
 ga_gathering.12.title: "The Shoals Have Their Price"
 ga_gathering.12.desc: "Our captains know the shoals others fear. A powerful friend may keep our harbor safe; an oath would bring the usual obligations of vassalage. Neither need be accepted blindly."
 ga_gathering.13.a: "The Tidemother keeps her crown."
 ga_gathering.13.title: "The Tidemother's Terms"
 ga_gathering.13.desc: "No pact shall erase the maternal house. The Ashen Compact preserves our ruling dynasty and current succession law. We may lead the gathering ourselves, or accept protection on those terms."
 ga_gathering.14.a: "Weigh the oath carefully."
 ga_gathering.14.title: "No Axe Without Leave"
 ga_gathering.14.desc: "The woodland captains fear tribute as much as invasion. An alliance can protect our independence; a stronger patron may make submission worthwhile. Our decision remains ours."
 ga_gathering_of_five: "The Gathering of the Five"
 ga_gathering_of_five_desc: "The five Ashborn kingdoms compete to unite their homeland through conquest, vassalage or unions. Alliances help cooperation but do not complete the struggle. Every starting goblin location must be held within one realm."
 ga_eastern_hunger: "The Eastern Hunger"
 ga_eastern_hunger_desc: "The united Ashborn look toward Europe. Chart a coast, pay for preparations and obtain a temporary conquest casus belli. A European coastal foothold completes this ambition; wars and peace deals follow the normal rules."
 ga_choose_kingdom: "Choose an Ashborn Kingdom"
 ga_no_kingdom_available: "No eligible independent Ashborn kingdom is available."
 ga_choose_eastern_province: "Choose a European Coastal Province"
 ga_no_eastern_target: "No eligible discovered European coastal province. Explore first, and check alliances, truces and diplomatic restrictions."
 ga_relations: "Relations with the other kingdom"
